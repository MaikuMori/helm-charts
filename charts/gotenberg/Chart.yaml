apiVersion: v2
name: gotenberg
icon: https://user-images.githubusercontent.com/8983173/130322857-185831e2-f041-46eb-a17f-0a69d066c4e5.png
description: A Helm chart for Gotenberg

type: application
version: "1.26.0"
appVersion: "8.38.1"

keywords:
  - gotenberg
  - pdf

sources:
  - https://github.com/gotenberg/gotenberg
  - https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg

maintainers:
  - name: MaikuMori
    email: mikskalnins@maikumori.com
    url: maikumori.com

annotations:
  # This annotation allows including named links, which will be rendered nicely in Artifact Hub.
  # You can use this annotation to include links not included previously in the Chart.yaml file,
  # or you can use it to name links already present (in the sources section, for example).
  artifacthub.io/links: |
    - name: Projects Homepage
      url: https://gotenberg.dev/
    - name: Projects GitHub
      url: https://github.com/gotenberg/gotenberg
    - name: Chart's GitHub
      url: https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg
    - name: Chart's Changelog
      url: https://github.com/MaikuMori/helm-charts/blob/master/charts/gotenberg/CHANGELOG.md
  artifacthub.io/changes: |
    - kind: changed
      description: Bump Gotenberg version 8.36.0 -> 8.38.1 (via 8.37.0 and 8.38.0)
    - kind: changed
      description: "Upstream behavior change: each Chromium conversion runs in its own browser context, so cookies, cache and storage no longer carry over; set chromium.sharedBrowserContext to restore sharing"
    - kind: changed
      description: "Upstream behavior change: api.bodyLimit is enforced on the raw request body before parsing, so multipart overhead now counts toward it"
    - kind: added
      description: Add chromium.sharedBrowserContext; clearCache, clearCookies and clearStorage now only apply with it
    - kind: added
      description: Add api.downloadFromMaxConcurrency and api.downloadFromMaxEntries to bound downloadFrom fetches
    - kind: added
      description: Add pdfEngines.maxConcurrency to process a request's PDF files concurrently
    - kind: security
      description: "Upstream: allow/deny-list matching strips URL userinfo, CGNAT and benchmarking ranges count as non-public, and IPv6 zone identifiers no longer bypass the private IP checks"
    - kind: security
      description: "Upstream: Chromium loopback WebSockets are filtered against the allow-list and deny-list"
    - kind: security
      description: "Upstream: Chromium updated to 155.0.8059.39, fixing CVE-2026-87654"
