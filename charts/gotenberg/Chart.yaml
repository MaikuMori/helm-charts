apiVersion: v2
name: gotenberg
icon: https://user-images.githubusercontent.com/8983173/130322857-185831e2-f041-46eb-a17f-0a69d066c4e5.png
description: A Helm chart for Gotenberg

type: application
version: "2.0.0"
appVersion: "9.10.2"
kubeVersion: ">=1.30.0-0"

keywords:
  - gotenberg
  - pdf

sources:
  - https://github.com/gotenberg/gotenberg
  - https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg

maintainers:
  - name: MaikuMori
    email: mikskalnins@maikumori.com
    url: maikumori.com

annotations:
  # This annotation allows including named links, which will be rendered nicely in Artifact Hub.
  # You can use this annotation to include links not included previously in the Chart.yaml file,
  # or you can use it to name links already present (in the sources section, for example).
  artifacthub.io/links: |
    - name: Projects Homepage
      url: https://gotenberg.dev/
    - name: Projects GitHub
      url: https://github.com/gotenberg/gotenberg
    - name: Chart's GitHub
      url: https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg
    - name: Chart's Changelog
      url: https://github.com/MaikuMori/helm-charts/blob/master/charts/gotenberg/CHANGELOG.md
  artifacthub.io/signKey: |
    fingerprint: F29F20C1CBD1FDE9566828E0641F7D67BC03019B
    url: https://raw.githubusercontent.com/MaikuMori/helm-charts/master/pubkey.asc
  artifacthub.io/changes: |
    - kind: changed
      description: Bump Gotenberg to 9.10.2, a major release. Routes, form fields, flags and metrics change, so read Gotenberg's upgrade guide and the chart's CHANGELOG before upgrading
    - kind: removed
      description: Remove the values for flags Gotenberg 9 removed, the deprecated aliases and service.loadBalancerIP
    - kind: changed
      description: Metrics are off by default and served through Gotenberg's OpenTelemetry Prometheus exporter on a separate metrics Service when metrics.enabled or metrics.serviceMonitor.enabled is set
    - kind: changed
      description: Every Gotenberg flag that works in a pod has a value, unset leaves Gotenberg's default and any set value is passed as is, with the schema refusing what Gotenberg refuses. Allow and deny lists are YAML lists
    - kind: changed
      description: networkPolicy.ingress and networkPolicy.egress take the rules directly, basic auth moves to api.basicAuth, the PDB takes numbers or percentages, and pdb.create and vpa.create become enabled
    - kind: changed
      description: The chart requires Kubernetes 1.30 or later
    - kind: changed
      description: Rollouts keep connections with a default preStop sleep and a longer grace period, progressDeadlineSeconds defaults to 600, and enableServiceLinks defaults to false
    - kind: added
      description: Add the pdf values for Gotenberg 9's PDF module, metrics Service metadata, and values for the new archive, memory limit, macro and DevTools debug flags
    - kind: fixed
      description: Quote inline basic auth credentials, fail early on auth settings Gotenberg refuses, drop the default httpGet from probes with another handler, and run helm test over HTTPS and under api.rootPath
    - kind: changed
      description: securityContext keys merge onto the restricted default, the default probes follow api.tlsSecretName and api.rootPath, and testImage.tag alone pulls that tag
    - kind: fixed
      description: A preStop handler set in values replaces the default sleep, and the install refuses values Kubernetes would reject, such as an empty PDB budget, port 0 or an Ingress without hosts
    - kind: changed
      description: image.repository and testImage.repository default to fully qualified docker.io names, which CRI-O without a short-name registry needs
    - kind: added
      description: The install notes give the in-cluster URL, try-it commands and the metrics URL, and warn about risky settings
    - kind: security
      description: The hardening example also denies private timestamp authority URLs
    - kind: changed
      description: Refresh the helm test busybox 1.38.0 image digest
