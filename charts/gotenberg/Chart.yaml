apiVersion: v2
name: gotenberg
icon: https://user-images.githubusercontent.com/8983173/130322857-185831e2-f041-46eb-a17f-0a69d066c4e5.png
description: A Helm chart for Gotenberg

type: application
version: "1.29.0"
appVersion: "8.38.1"

keywords:
  - gotenberg
  - pdf

sources:
  - https://github.com/gotenberg/gotenberg
  - https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg

maintainers:
  - name: MaikuMori
    email: mikskalnins@maikumori.com
    url: maikumori.com

annotations:
  # This annotation allows including named links, which will be rendered nicely in Artifact Hub.
  # You can use this annotation to include links not included previously in the Chart.yaml file,
  # or you can use it to name links already present (in the sources section, for example).
  artifacthub.io/links: |
    - name: Projects Homepage
      url: https://gotenberg.dev/
    - name: Projects GitHub
      url: https://github.com/gotenberg/gotenberg
    - name: Chart's GitHub
      url: https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg
    - name: Chart's Changelog
      url: https://github.com/MaikuMori/helm-charts/blob/master/charts/gotenberg/CHANGELOG.md
  artifacthub.io/signKey: |
    fingerprint: F29F20C1CBD1FDE9566828E0641F7D67BC03019B
    url: https://raw.githubusercontent.com/MaikuMori/helm-charts/master/pubkey.asc
  artifacthub.io/changes: |
    - kind: security
      description: Outside OpenShift, the default container security context now meets the Pod Security restricted level, adding runAsNonRoot, dropping all capabilities and using the RuntimeDefault seccomp profile. Experimental; see the changelog to revert it
    - kind: added
      description: Attest the build provenance of the release archive and the OCI chart with GitHub artifact attestations
    - kind: added
      description: Document resource recommendations and a hardening example to start from for untrusted input
    - kind: fixed
      description: Allow Helm's global values in the schema so the chart works as a dependency of another chart
    - kind: fixed
      description: Accept numbers for chromium.restartAfter, libreOffice.restartAfter and webhook.maxRetry
    - kind: fixed
      description: "Behaviour change: chromium.restartAfter, libreOffice.restartAfter, api.downloadFromMaxRetry, webhook.maxRetry and gotenberg.gracefulShutdownDurationSec set to 0 now pass 0 to Gotenberg instead of leaving its default"
    - kind: fixed
      description: helm test pods no longer match the chart's Service, PodDisruptionBudget and NetworkPolicy selectors
    - kind: fixed
      description: The helm test connection check retries instead of hanging when it starts right after an upgrade
