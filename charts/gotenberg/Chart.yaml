apiVersion: v2
name: gotenberg
icon: https://user-images.githubusercontent.com/8983173/130322857-185831e2-f041-46eb-a17f-0a69d066c4e5.png
description: A Helm chart for Gotenberg

type: application
version: "2.0.0"
appVersion: "9.10.2"
kubeVersion: ">=1.30.0-0"

keywords:
  - gotenberg
  - pdf

sources:
  - https://github.com/gotenberg/gotenberg
  - https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg

maintainers:
  - name: MaikuMori
    email: mikskalnins@maikumori.com
    url: maikumori.com

annotations:
  # This annotation allows including named links, which will be rendered nicely in Artifact Hub.
  # You can use this annotation to include links not included previously in the Chart.yaml file,
  # or you can use it to name links already present (in the sources section, for example).
  artifacthub.io/links: |
    - name: Projects Homepage
      url: https://gotenberg.dev/
    - name: Projects GitHub
      url: https://github.com/gotenberg/gotenberg
    - name: Chart's GitHub
      url: https://github.com/MaikuMori/helm-charts/tree/master/charts/gotenberg
    - name: Chart's Changelog
      url: https://github.com/MaikuMori/helm-charts/blob/master/charts/gotenberg/CHANGELOG.md
  artifacthub.io/signKey: |
    fingerprint: F29F20C1CBD1FDE9566828E0641F7D67BC03019B
    url: https://raw.githubusercontent.com/MaikuMori/helm-charts/master/pubkey.asc
  artifacthub.io/changes: |
    - kind: changed
      description: Bump Gotenberg to 9.10.2, a major release. Read Gotenberg's upgrade guide before you upgrade
    - kind: changed
      description: The chart needs Kubernetes 1.30 or later
    - kind: changed
      description: Upgrade with --reset-values -f values.yaml. --reuse-values brings back 1.x keys the schema rejects
    - kind: changed
      description: Flag values default to unset, which leaves Gotenberg's default. A value you set is passed as is, including 0, false, empty strings and empty lists
    - kind: changed
      description: Allow and deny lists are YAML lists with one pattern per entry
    - kind: changed
      description: Basic auth moves to api.basicAuth, and networkPolicy.ingress and networkPolicy.egress take the rules directly
    - kind: changed
      description: Metrics are off by default. metrics.enabled serves /metrics on port 9464 through a separate Service, and metric names change
    - kind: changed
      description: Images are fully qualified as docker.io/gotenberg/gotenberg and docker.io/library/busybox
    - kind: changed
      description: lifecycle defaults to a 5s preStop sleep, which a preStop handler of your own replaces
    - kind: changed
      description: securityContext keys merge onto the restricted default instead of replacing it
    - kind: removed
      description: Values for flags Gotenberg 9 removed, the deprecated aliases and service.loadBalancerIP
    - kind: fixed
      description: The install fails on values Kubernetes or Gotenberg would reject, such as an empty image.repository, port 0 or an Ingress without hosts
    - kind: fixed
      description: A probe with an exec, tcpSocket or grpc handler drops the default httpGet
    - kind: added
      description: pdf values for the new PDF module, and values for the new archive, memory, macro and debug protocol flags
    - kind: added
      description: The install notes show how to reach and test the release, and warn about risky settings
    - kind: security
      description: The hardening example sets pdf.denyPrivateIps
