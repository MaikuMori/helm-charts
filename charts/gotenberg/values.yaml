# Default values for gotenberg.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Specifies that chart can be used as a condition when it is a dependency.
# See https://helm.sh/docs/chart_best_practices/dependencies/#conditions-and-tags for more info.
# @ignored
enabled: true

replicaCount: 1

image:  # @schema additionalProperties: false
  repository: gotenberg/gotenberg
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # -- Image digest, e.g. `sha256:...`. When set, the image is pulled by digest.
  digest: ""  # @schema pattern: ^(sha256:[a-f0-9]{64})?$

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:  # @schema additionalProperties: false
  # -- Specifies whether a service account should be created
  create: false
  # -- Mount the service account's API token in the pods. Gotenberg doesn't use the Kubernetes API.
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  ## If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# -- Set annotations for the helm test pods (for example to disable certain kube-score checks)
testPodAnnotations: {}

# -- Image configuration for the helm test pod
testImage:  # @schema additionalProperties: false
  # -- Repository for the test image
  repository: busybox
  # -- Tag for the test image
  tag: "1.38.0"
  # -- Digest for the test image. Set to "" to pull by tag only.
  digest: "sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"  # @schema pattern: ^(sha256:[a-f0-9]{64})?$

# -- List of additional pod labels
podLabels: {}

# -- Inject service discovery environment variables (`<SVCNAME>_SERVICE_HOST`, `<SVCNAME>_PORT`, ...) into the pod. Gotenberg doesn't use them, and they collide with its own configuration: a Service named `api` in the same namespace injects `API_PORT=tcp://<clusterIP>:<port>`, which Gotenberg reads as an override for `--api-port` and refuses to start.
enableServiceLinks: false

podSecurityContext:
  {}
  # fsGroup: 2000

# -- Define the security context for the container. Replaces the default entirely when set.
# @default -- Meets the Pod Security `restricted` level: runs as non-root user 1001, with no privilege escalation, all capabilities dropped and the `RuntimeDefault` seccomp profile unless `podSecurityContext` sets one. On OpenShift, the user, non-root check and seccomp profile are left to the SCC. The root filesystem stays writable for Chromium.
securityContext: {}

service:  # @schema additionalProperties: false
  type: ClusterIP
  port: 80
  # -- Annotations to add to the service
  annotations: {}

# Strategy is utilized to configure the desired upgrade approach and
# configuration for the deployment.
strategy: {}

# -- Seconds a rollout may take before Kubernetes reports it failed. Each node pulls the 1.5GB image on an upgrade.
progressDeadlineSeconds: 600

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Define the container lifecycle hooks. The default `preStop` sleep keeps the server accepting connections while Service endpoints propagate on shutdown, which prevents dropped connections during scale-down and rolling updates: an idle Gotenberg exits within milliseconds of SIGTERM. The `sleep` action needs Kubernetes 1.30; set `lifecycle: {}` on older clusters.
lifecycle:
  preStop:
    sleep:
      seconds: 5

# -- (int) Seconds Kubernetes waits for the pod to stop. Leave unset for `gotenberg.gracefulShutdownDurationSec` plus 10, which covers the `preStop` sleep.
terminationGracePeriodSeconds:  # @schema type: [integer, null]; minimum: 0

# -- Define the liveness probe object for the container.
livenessProbe:
  httpGet:
    path: /health
    port: http  # @schema type: [string, integer]

# -- Define the readiness probe object for the container.
readinessProbe:
  httpGet:
    path: /health
    port: http  # @schema type: [string, integer]

# -- Define the startup probe object for the container.
startupProbe:
  httpGet:
    path: /health
    port: http  # @schema type: [string, integer]
  failureThreshold: 30
  periodSeconds: 10

autoscaling:  # @schema additionalProperties: false
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  behavior: {}
  extraMetrics: []
  targetCPUUtilizationPercentage: 80
  # -- (int) Target average memory utilization percentage. Leave unset to not scale on memory.
  targetMemoryUtilizationPercentage:  # @schema type: [integer, null]

vpa:  # @schema additionalProperties: false
  # -- Create a VerticalPodAutoscaler resource for right-sizing pod resources.
  # Requires the VPA controller to be installed in the cluster.
  # See also: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
  enabled: false
  # -- Update mode for VPA: Auto (resize in-place or restart), Recreate (restart to resize), Initial (set at creation only), Off (recommendations only)
  updateMode: "Auto"
  # -- Resource policy for VPA to control which containers and resources are autoscaled, see values.yaml for an example.
  resourcePolicy: {}
  #  containerPolicies:
  #    - containerName: gotenberg
  #      minAllowed:
  #        cpu: 100m
  #        memory: 256Mi
  #      maxAllowed:
  #        cpu: 2
  #        memory: 4Gi

pdb:  # @schema additionalProperties: false
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- (int or string) Pods that must stay available, as a number or a percentage such as "50%". Set this or `maxUnavailable`; with neither, the PDB keeps 1 available.
  minAvailable:  # @schema type: [integer, string, null]
  # -- (int or string) Pods that may be unavailable, as a number or a percentage such as "25%". Set this or `minAvailable`.
  maxUnavailable:  # @schema type: [integer, string, null]
  # -- Unhealthy pod eviction policy for the PDB (e.g., AlwaysAllow)
  unhealthyPodEvictionPolicy:  # @schema type: [string, null]; enum: [IfHealthyBudget, AlwaysAllow, null]

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

volumes: []
#  - name: tmp-volume
#    emptyDir:
#      medium: Memory
#      sizeLimit: 2Gi

volumeMounts: []
#  - name: tmp-volume
#    mountPath: /tmp

# -- List of extra environment variables for gotenberg container. Every Gotenberg flag also reads an environment variable, which wins over the chart's value, e.g. `API_BIND_IP` for a flag the chart doesn't map. Gotenberg exports traces, metrics and logs with the standard `OTEL_*` variables; to serve Prometheus metrics, use `metrics.enabled` instead.
# See https://gotenberg.dev/docs/configuration for details.
extraEnv: []
#  - name: OTEL_EXPORTER_OTLP_ENDPOINT
#    value: "http://otel-collector:4317"
#  - name: OTEL_TRACES_EXPORTER
#    value: "otlp"
#  - name: OTEL_LOGS_EXPORTER
#    value: "otlp"

# -- List of init containers for the gotenberg pod
initContainers: []
#  - name: init-myservice
#    image: busybox:1.28
#    command: ['sh', '-c', 'echo init container']

ingress:  # @schema additionalProperties: false
  # -- Set to true to enable ingress record generation. WARNING: Gotenberg shouldn't be exposed to the internet.
  enabled: false
  # -- Set the class name of the ingress
  className: ""
  # -- Set the annotations of the ingress
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  # -- Set the labels of the ingress
  labels:
    {}
  # -- Set the hostnames of the ingress, see values.yaml for an example.
  hosts:
    []
    # - host: chart-example.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific

  # -- Set the TLS configuration for the ingress, see values.yaml for an example.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute configuration.
# WARNING: Gotenberg shouldn't be exposed to the internet.
# See also: https://gateway-api.sigs.k8s.io/
gateway:  # @schema additionalProperties: false
  # -- Set to true to create an HTTPRoute resource
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Labels to add to the HTTPRoute
  labels: {}
  # -- Parent Gateway references, see values.yaml for an example.
  parentRefs: []
  #  - name: my-gateway
  #    namespace: default
  #    sectionName: https
  # -- Hostnames to match for routing, see values.yaml for an example.
  hostnames: []
  #  - gotenberg.example.local

# The API module is an HTTP/1 and HTTP/2 (H2C) server. Other modules may add routes, middlewares, and health checks.
# https://gotenberg.dev/docs/configuration#api
api:  # @schema additionalProperties: false
  # -- Set the port on which the API should listen (default 3000)
  port: 3000
  # -- Enables TLS on the API server: K8S TLS secret name containing the TLS certificate and key (tls.crt, tls.key). Set `scheme: HTTPS` on the probes too.
  tlsSecretName: ""
  # -- Set the time limit for requests (default 30s)
  timeout: ""
  # -- Set the request body limit for multipart/form-data (e.g., "100MB")
  bodyLimit: ""
  # -- Set the root path of the API, e.g. "/gotenberg/" - for service discovery via URL paths (default "/"). `/health` moves under it: update the probe paths too.
  rootPath: ""
  # -- Set the header name to use for identifying requests (default "Gotenberg-Trace")
  correlationIdHeader: ""
  # -- (bool) Disable health check route telemetry. Leave unset for the upstream default (true).
  disableHealthCheckRouteTelemetry:  # @schema type: [boolean, null]
  # -- (bool) Disable telemetry on the root route. Leave unset for the upstream default (true).
  disableRootRouteTelemetry:  # @schema type: [boolean, null]
  # -- (bool) Disable telemetry on the debug route. Leave unset for the upstream default (true).
  disableDebugRouteTelemetry:  # @schema type: [boolean, null]
  # -- (bool) Disable telemetry on the version route. Leave unset for the upstream default (true).
  disableVersionRouteTelemetry:  # @schema type: [boolean, null]
  # -- Enable debug route for debugging purposes
  enableDebugRoute: false
  # -- Set the maximum duration to wait for the API to start
  startTimeout: ""
  basicAuth:  # @schema additionalProperties: false
    # -- Enable basic authentication, with credentials from `existingSecret`, or `username` and `password`. Mutually exclusive with `enableOidcAuth`.
    enabled: false
    # -- Name of an existing secret holding the credentials
    existingSecret: ""
    # -- Key in `existingSecret` for the username (default: username)
    usernameKey: ""
    # -- Key in `existingSecret` for the password (default: password)
    passwordKey: ""
    # -- Set the username (ignored if existingSecret is set)
    username:  # @schema type: [string, null]
    # -- Set the password (ignored if existingSecret is set)
    password:  # @schema type: [string, null]
  # -- Enable OIDC bearer token authentication. Mutually exclusive with `basicAuth.enabled`.
  enableOidcAuth: false
  # -- Set the OIDC issuer URL, e.g. `https://tenant.example.com/` - the token `iss` claim must match.
  oidcIssuer: ""
  # -- Set the expected OIDC audience - the token `aud` claim must contain it.
  oidcAudience: ""
  # -- Set the OIDC JWKS URL. Discovered from the issuer's well-known configuration when empty.
  oidcJwksUrl: ""
  # -- List of regular expressions for the allowed `downloadFrom` URLs. Terminate the host, e.g. `^https://files\.example\.com/`: a match skips the IP-class checks.
  downloadFromAllowList: []  # @schema item: string; itemPattern: ^.+$
  # -- List of regular expressions for the denied `downloadFrom` URLs
  downloadFromDenyList: []  # @schema item: string; itemPattern: ^.+$
  # -- Reject `downloadFrom` URLs resolving to a non-public IP (loopback, RFC1918, link-local, IPv6 unique-local). A URL matching `downloadFromAllowList` skips the IP-class check; a URL matching `downloadFromDenyList` is always rejected.
  downloadFromDenyPrivateIps: false
  # -- Reject `downloadFrom` URLs resolving to a public IP. Setting both `downloadFromDenyPrivateIps` and `downloadFromDenyPublicIps` to true rejects every URL unless the allow-list matches.
  downloadFromDenyPublicIps: false
  # -- (int) Set the maximum number of retries for the download from feature. Leave unset for the upstream default (4).
  downloadFromMaxRetry:  # @schema type: [integer, null]; minimum: 0
  # -- (int) Set the maximum number of concurrent fetches per request for the download from feature. Leave unset for the upstream default (10); set to 0 for no limit.
  downloadFromMaxConcurrency:  # @schema type: [integer, null]; minimum: 0
  # -- (int) Set the maximum number of entries in the `downloadFrom` array. Leave unset or set to 0 for no limit.
  downloadFromMaxEntries:  # @schema type: [integer, null]; minimum: 0
  # -- Route `downloadFrom` fetches through the proxy defined by the standard `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` variables (set them via `extraEnv`), credentials included.
  downloadFromEnableEnvironmentProxy: false
  # -- Disable the download from feature
  disableDownloadFrom: false
  # -- (int) Set the maximum number of entries of a zip archive sent in the `archives` form field. Must be positive. Leave unset for the upstream default (10000).
  archiveMaxEntries:  # @schema type: [integer, null]; minimum: 1
  # -- (int) Set how many times its own size a zip archive sent in the `archives` form field may unpack to. Must be positive. Leave unset for the upstream default (100).
  archiveMaxRatio:  # @schema type: [integer, null]; minimum: 1

# The Chromium module interacts with the Chromium browser to convert HTML documents to PDF.
# https://gotenberg.dev/docs/configuration#chromium
chromium:  # @schema additionalProperties: false
  # -- (int) Number of conversions after which Chromium will automatically restart. Set to 0 to disable this feature. Leave unset for the upstream default (100).
  restartAfter:  # @schema type: [integer, null]; minimum: 0
  # -- (int) Maximum number of concurrent Chromium conversions, from 1 to 6. Leave unset for the upstream default (6).
  maxConcurrency:  # @schema type: [integer, null]; minimum: 1; maximum: 6
  # -- Automatically launch Chromium upon initialization if set to true; otherwise, Chromium will start at the time of the first conversion
  autoStart: false
  # -- Maximum duration to wait for Chromium to start or restart (default 20s)
  startTimeout: ""
  # -- Allow file:// URIs to read other file:// URIs
  allowFileAccessFromFiles: false
  # -- Ignore TLS/SSL errors on localhost
  allowInsecureLocalhost: false
  # -- List of regular expressions for the allowed Chromium URLs. The page sent to the HTML and Markdown routes skips the lists, but the files uploaded with it load from `file:///tmp/`: include `^file:///tmp/` to keep them. Terminate the host, e.g. `^https://assets\.example\.com/`: a match skips the IP-class checks.
  allowList: []  # @schema item: string; itemPattern: ^.+$
  # -- List of regular expressions for the denied Chromium URLs. Setting it replaces the upstream default, `^file:(?!//\/tmp/).*`.
  denyList: []  # @schema item: string; itemPattern: ^.+$
  # -- Reject Chromium navigations and sub-resources resolving to a non-public IP (loopback, RFC1918, link-local, IPv6 unique-local). A URL matching `allowList` skips the IP-class check; a URL matching `denyList` is always rejected. With `proxyServer`, a DNS rebinding can slip past it.
  denyPrivateIps: false
  # -- Reject Chromium navigations and sub-resources resolving to a public IP. Setting both `denyPrivateIps` and `denyPublicIps` to true rejects every URL unless the allow-list matches.
  denyPublicIps: false
  # -- Ignore the certificate errors
  ignoreCertificateErrors: false
  # -- Don't enforce the same-origin policy
  disableWebSecurity: false
  # -- Set custom mappings to the host resolver, e.g. `MAP intranet.local 10.0.0.5`. The IP-class checks still apply to the mapped address.
  hostResolverRules: ""
  # -- Set the outbound proxy server; this switch only affects HTTP and HTTPS requests
  proxyServer: ""
  # -- Route Chromium's outbound requests through the proxy defined by the standard `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` variables (set them via `extraEnv`), credentials included. Use this instead of `proxyServer` for authenticated proxies, and leave `proxyServer` and `hostResolverRules` unset.
  enableEnvironmentProxy: false
  # -- Disable JavaScript
  disableJavaScript: false
  # -- Disable the routes
  disableRoutes: false
  # -- Share one browser context, with its cookies, cache and storage, across all conversions. Each conversion gets its own isolated context by default; enable this only when all callers trust each other.
  sharedBrowserContext: false
  # -- Clear Chromium cache between each conversion. Only applies with `sharedBrowserContext`.
  clearCache: false
  # -- Clear Chromium cookies between each conversion. Only applies with `sharedBrowserContext`.
  clearCookies: false
  # -- Clear Chromium local storage between each conversion. Only applies with `sharedBrowserContext`.
  clearStorage: false
  # -- (int) Maximum request queue size for Chromium. Set to 0 to disable this feature. Leave unset for the upstream default (0).
  maxQueueSize:  # @schema type: [integer, null]; minimum: 0
  # -- Duration after which idle Chromium browser processes are shut down (e.g., "30s"). Set to 0s or leave empty to disable (default 0s, disabled).
  idleShutdownTimeout: ""
  # -- Set the memory all Chromium processes together may hold while converting, e.g. "800MB". Over it, Gotenberg restarts Chromium and the conversions in flight answer 503. Chromium, LibreOffice and PDF processing share the container's memory: keep `maxMemory` here and in `libreOffice` together under its limit. Empty disables it. Added in Gotenberg 9.6.0.
  maxMemory: ""
  # -- Log every DevTools Protocol message at the debug log level. The messages carry URLs, cookies and header values, credentials included: enable it only to troubleshoot.
  debugProtocol: false

# The LibreOffice module converts documents to PDF with a supervised LibreOfficeKit process.
# https://gotenberg.dev/docs/configuration#libreoffice
libreOffice:  # @schema additionalProperties: false
  # -- (int) Number of conversions after which LibreOffice will automatically restart. Set to 0 to disable this feature. Leave unset for the upstream default (10).
  restartAfter:  # @schema type: [integer, null]; minimum: 0
  # -- Automatically launch LibreOffice upon initialization if set to true; otherwise, LibreOffice will start at the time of the first conversion (default false)
  autoStart: false
  # -- Maximum duration to wait for LibreOffice to start or restart (default 20s)
  startTimeout: ""
  # -- Disable the routes
  disableRoutes: false
  # -- (int) Maximum request queue size for LibreOffice. Set to 0 to disable this feature. Leave unset for the upstream default (0).
  maxQueueSize:  # @schema type: [integer, null]; minimum: 0
  # -- Duration after which idle LibreOffice processes are shut down (e.g., "30s"). Set to 0s or leave empty to disable (default 0s, disabled).
  idleShutdownTimeout: ""
  # -- List of regular expressions for the allowed URLs LibreOffice requests: the style sheets an HTML document links, and the URLs macros open with `enableMacros`. Terminate the host: a match skips the IP-class checks.
  allowList: []  # @schema item: string; itemPattern: ^.+$
  # -- List of regular expressions for the denied URLs LibreOffice requests
  denyList: []  # @schema item: string; itemPattern: ^.+$
  # -- Reject LibreOffice requests resolving to a non-public IP (loopback, RFC1918, link-local, IPv6 unique-local). A URL matching `allowList` skips the IP-class check; a URL matching `denyList` is always rejected.
  denyPrivateIps: false
  # -- Reject LibreOffice requests resolving to a public IP. Setting both `denyPrivateIps` and `denyPublicIps` to true rejects every URL unless the allow-list matches.
  denyPublicIps: false
  # -- Route LibreOffice requests through the proxy defined by the standard `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` variables (set them via `extraEnv`), credentials included.
  enableEnvironmentProxy: false
  # -- Set the memory LibreOffice may hold during a conversion, e.g. "900MB". Over it, Gotenberg kills LibreOffice and answers that conversion 422. Keep it and `chromium.maxMemory` together under the container's memory limit. Empty disables it. Added in Gotenberg 9.6.0.
  maxMemory: ""
  # -- Run the macros of converted documents, including those bound to document events. Macros run code inside the container: enable it only for trusted documents.
  enableMacros: false

# The PDF module merges, splits, stamps, remediates and otherwise processes PDFs, on the /forms/pdf routes and as stages of the conversion routes.
# https://gotenberg.dev/docs/configuration#pdf
pdf:  # @schema additionalProperties: false
  # -- (int) Maximum number of PDF documents a request processes at once. Leave unset for the upstream default (1).
  maxConcurrency:  # @schema type: [integer, null]; minimum: 1
  # -- Disable the /forms/pdf routes. Conversion routes still run stages: set `disableStages` too to turn off PDF processing.
  disableRoutes: false
  # -- Refuse the `stages` field of the Chromium and LibreOffice routes, so they only convert. Added in Gotenberg 9.3.0.
  disableStages: false
  # -- Set the maximum size a PDF stream may decode to, e.g. "512MB" (default 256MiB)
  maxStreamBytes: ""
  # -- Set the maximum size of an embedded file read for validation, e.g. "100MB" (default 50MiB)
  maxEmbeddedFileBytes: ""
  # -- (int) Set the maximum number of pixels an image may hold. Leave unset for the upstream default (100000000).
  maxImagePixels:  # @schema type: [integer, null]; minimum: 0
  # -- (int) Set the maximum number of pixels a page the render stage draws may hold, at 16 bytes of memory each. Leave unset for the upstream default (50000000). Added in Gotenberg 9.3.0.
  maxRenderPixels:  # @schema type: [integer, null]; minimum: 0
  # -- List of regular expressions for the allowed timestamp authority URLs of the sign and timestamp stages. Terminate the host: a match skips the IP-class checks.
  allowList: []  # @schema item: string; itemPattern: ^.+$
  # -- List of regular expressions for the denied timestamp authority URLs of the sign and timestamp stages
  denyList: []  # @schema item: string; itemPattern: ^.+$
  # -- Reject timestamp authority URLs resolving to a non-public IP (loopback, RFC1918, link-local, IPv6 unique-local). Callers choose these URLs: enable it for untrusted callers. A URL matching `allowList` skips the IP-class check.
  denyPrivateIps: false
  # -- Reject timestamp authority URLs resolving to a public IP
  denyPublicIps: false
  # -- Route timestamp authority requests through the proxy defined by the standard `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` variables (set them via `extraEnv`), credentials included.
  enableEnvironmentProxy: false

# The Webhook module provides a middleware that allows you to upload the output file
# from multipart/form-data routes to the destination of your choice.
# https://gotenberg.dev/docs/configuration#webhook
webhook:  # @schema additionalProperties: false
  # -- Enable synchronous mode for the webhook feature
  enableSyncMode: false
  # -- List of regular expressions for the allowed webhook URLs. Terminate the host: a match skips the IP-class checks.
  allowList: []  # @schema item: string; itemPattern: ^.+$
  # -- List of regular expressions for the denied webhook URLs
  denyList: []  # @schema item: string; itemPattern: ^.+$
  # -- Reject webhook URLs (result and events) resolving to a non-public IP (loopback, RFC1918, link-local, IPv6 unique-local). A URL matching `allowList` skips the IP-class check; a URL matching `denyList` is always rejected.
  denyPrivateIps: false
  # -- Reject webhook URLs resolving to a public IP. Setting both `denyPrivateIps` and `denyPublicIps` to true rejects every URL unless the allow-list matches.
  denyPublicIps: false
  # -- (int) Set the maximum number of retries for the webhook feature. Leave unset for the upstream default (4).
  maxRetry:  # @schema type: [integer, null]; minimum: 0
  # -- Set the minimum duration to wait before trying to call the webhook again (default 1s)
  retryMinWait: ""
  # -- Set the maximum duration to wait before trying to call the webhook again (default 30s)
  retryMaxWait: ""
  # -- Set the time limit for requests to the webhook (default 30s)
  clientTimeout: ""
  # -- Route webhook callbacks through the proxy defined by the standard `HTTP_PROXY`, `HTTPS_PROXY` and `NO_PROXY` variables (set them via `extraEnv`), credentials included.
  enableEnvironmentProxy: false
  # -- Disable the webhook feature
  disable: false

# The Logging module provides a logger to Gotenberg.
# https://gotenberg.dev/docs/configuration#logging
logging:  # @schema additionalProperties: false
  # -- Set the log format - auto, json, or text (default "auto"). Gotenberg logs to stderr.
  stdFormat: ""
  # -- Set the case of the `level` field - lower or upper (default "lower")
  stdLevelCase: ""
  # -- Set the log level - error, warn, info, or debug (default "info")
  level: ""
  # -- Prepend a specified prefix to each field in the logs
  fieldsPrefix: ""
  # -- Enable GCP log field mapping for Cloud Run
  stdEnableGcpFields: false

# Misc.
# https://gotenberg.dev/docs/configuration#gotenberg
gotenberg:  # @schema additionalProperties: false
  # -- Set the graceful shutdown duration in seconds
  gracefulShutdownDurationSec: 30  # @schema minimum: 0

metrics:  # @schema additionalProperties: false
  # -- Serve Prometheus metrics at `/metrics` on `metrics.port`, through Gotenberg's OpenTelemetry Prometheus exporter, with a ClusterIP `<fullname>-metrics` Service. Also on when `serviceMonitor.enabled` is true. The chart then sets the `OTEL_METRICS_EXPORTER` and `OTEL_EXPORTER_PROMETHEUS_*` variables, so `extraEnv` can't.
  enabled: false
  # -- Port of the Prometheus metrics endpoint, on the container and the metrics Service. Must differ from `api.port`.
  port: 9464  # @schema minimum: 1; maximum: 65535
  service:  # @schema additionalProperties: false
    # -- Annotations to add to the metrics Service
    annotations: {}
    # -- Labels to add to the metrics Service
    labels: {}
  serviceMonitor:  # @schema additionalProperties: false
    # -- Enable ServiceMonitor. Turns the metrics endpoint on.
    enabled: false
    # -- (string) Namespace for ServiceMonitor, defaults to release namespace
    namespace:  # @schema type: [string, null]
    # -- (string) Optional job label for the target service in Prometheus
    jobLabel:  # @schema type: [string, null]
    # -- (string) Interval at which metrics should be scraped
    interval:  # @schema type: [string, null]
    # -- (string) Timeout after which the scrape is ended
    scrapeTimeout:  # @schema type: [string, null]
    # -- HonorLabels chooses the metric’s labels on collisions with target labels
    honorLabels: false
    # -- List of metric relabel configs to apply to samples before ingestion
    metricRelabelings: []
    # -- List of relabel configs to apply to samples before scraping
    relabelings: []
    # -- Additional annotations for the service monitor
    annotations: {}
    # -- Additional labels for the service monitor
    labels: {}

