  correlationIdHeader: correlationIdHeader-value
  disableDebugRouteTelemetry: true
  disableDownloadFrom: true
  disableHealthCheckLogging: true
  disableHealthCheckRouteTelemetry: true
  disableRootRouteTelemetry: true
