# Sets every value that maps to a Gotenberg flag, so the snapshot covers each one.
# Add a value here when adding a flag; values are placeholders and only need to render.
api:
  archiveMaxEntries: 20000000
  archiveMaxRatio: 7
  bodyLimit: bodyLimit-value
  correlationIdHeader: correlationIdHeader-value
  disableDebugRouteTelemetry: true
  disableDownloadFrom: true
  disableHealthCheckRouteTelemetry: false
  disableRootRouteTelemetry: true
  disableVersionRouteTelemetry: true
  downloadFromAllowList:
    - ^https://[a-z]{1,10}\.downloadFromAllowList\.example\.com(:|/|$)
    - ^https://downloadFromAllowList\.example\.com/
  downloadFromDenyList:
    - ^https://[a-z]{1,10}\.downloadFromDenyList\.example\.com(:|/|$)
    - ^https://downloadFromDenyList\.example\.com/
  downloadFromDenyPrivateIps: true
  downloadFromDenyPublicIps: true
  downloadFromEnableEnvironmentProxy: true
  downloadFromMaxConcurrency: 7
  downloadFromMaxEntries: 7
  downloadFromMaxRetry: 11
  basicAuth:
    enabled: true
    password: password-value
    username: username-value
  enableDebugRoute: true
  enableOidcAuth: false
  oidcAudience: oidcAudience-value
  oidcIssuer: oidcIssuer-value
  oidcJwksUrl: oidcJwksUrl-value
  port: 3007
  rootPath: /rootPath-value/
  startTimeout: 7s
  timeout: 7s
chromium:
  allowFileAccessFromFiles: true
  allowInsecureLocalhost: true
  allowList:
    - ^https://[a-z]{1,10}\.allowList\.example\.com(:|/|$)
    - ^https://allowList\.example\.com/
  autoStart: true
  clearCache: true
  clearCookies: true
  clearStorage: true
  debugProtocol: true
  denyList:
    - ^https://[a-z]{1,10}\.denyList\.example\.com(:|/|$)
    - ^https://denyList\.example\.com/
  denyPrivateIps: true
  denyPublicIps: true
  disableJavaScript: true
  disableRoutes: true
  disableWebSecurity: true
  enableEnvironmentProxy: true
  hostResolverRules: hostResolverRules-value
  idleShutdownTimeout: 7s
  ignoreCertificateErrors: true
  maxConcurrency: 4
  maxMemory: maxMemory-value
  maxQueueSize: 7
  proxyServer: proxyServer-value
  restartAfter: 7
  sharedBrowserContext: true
  startTimeout: 7s
gotenberg:
  buildDebugData: false
  gracefulShutdownDurationSec: 37
  hideBanner: true
libreOffice:
  allowList:
    - ^https://[a-z]{1,10}\.allowList\.example\.com(:|/|$)
    - ^https://allowList\.example\.com/
  autoStart: true
  denyList:
    - ^https://[a-z]{1,10}\.denyList\.example\.com(:|/|$)
    - ^https://denyList\.example\.com/
  denyPrivateIps: true
  denyPublicIps: true
  disableRoutes: true
  enableEnvironmentProxy: true
  enableMacros: true
  idleShutdownTimeout: 7s
  maxMemory: maxMemory-value
  maxQueueSize: 7
  restartAfter: 7
  startTimeout: 7s
logging:
  fieldsPrefix: fieldsPrefix-value
  level: debug
  stdEnableGcpFields: true
  stdFormat: json
  stdLevelCase: upper
pdf:
  allowList:
    - ^https://[a-z]{1,10}\.allowList\.example\.com(:|/|$)
    - ^https://allowList\.example\.com/
  denyList:
    - ^https://[a-z]{1,10}\.denyList\.example\.com(:|/|$)
    - ^https://denyList\.example\.com/
  denyPrivateIps: true
  denyPublicIps: true
  disableRoutes: true
  disableStages: true
  enableEnvironmentProxy: true
  maxConcurrency: 7
  maxEmbeddedFileBytes: maxEmbeddedFileBytes-value
  maxImagePixels: 200000000
  maxRenderPixels: 50000000
  maxStreamBytes: maxStreamBytes-value
webhook:
  allowList:
    - ^https://[a-z]{1,10}\.allowList\.example\.com(:|/|$)
    - ^https://allowList\.example\.com/
  clientTimeout: 7s
  denyList:
    - ^https://[a-z]{1,10}\.denyList\.example\.com(:|/|$)
    - ^https://denyList\.example\.com/
  denyPrivateIps: true
  denyPublicIps: true
  disable: true
  enableEnvironmentProxy: true
  enableSyncMode: true
  maxRetry: 7
  retryMaxWait: 7s
  retryMinWait: 7s
