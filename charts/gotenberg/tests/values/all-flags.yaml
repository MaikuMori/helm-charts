  downloadFromDenyPublicIps: true
  downloadFromEnableEnvironmentProxy: true
  downloadFromMaxConcurrency: 7
  downloadFromMaxEntries: 7
  downloadFromMaxRetry: 11
  enableBasicAuth: true
  enableDebugRoute: true
  enableOidcAuth: true
  oidcAudience: oidcAudience-value
