suite: values schema
templates:
  - templates/deployment.yaml
tests:
  - it: accepts any Kubernetes probe
    set:
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
          scheme: HTTPS
        initialDelaySeconds: 5
      readinessProbe:
        exec:
          command: [cat, /tmp/ready]
      startupProbe:
        tcpSocket:
          port: http
    asserts:
      - notFailedTemplate: {}

  - it: accepts free-form Kubernetes objects and maps
    set:
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      securityContext:
        runAsUser: 2000
        runAsNonRoot: true
      podSecurityContext:
        fsGroup: 2000
      podAnnotations:
        example.com/key: value
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Exists
      affinity:
        nodeAffinity: {}
      lifecycle:
        preStop:
          sleep:
            seconds: 5
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
      autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
    asserts:
      - notFailedTemplate: {}

  - it: accepts values that default to null
    set:
      api.basicAuth.username: user
      api.basicAuth.password: pass
      pdb.maxUnavailable: "25%"
      terminationGracePeriodSeconds: 60
      api.downloadFromMaxConcurrency: 3
      api.archiveMaxEntries: 5000
      api.archiveMaxRatio: 50
      api.disableRootRouteTelemetry: false
      autoscaling.targetMemoryUtilizationPercentage: 70
      pdb.unhealthyPodEvictionPolicy: AlwaysAllow
      metrics.serviceMonitor.namespace: monitoring
      metrics.serviceMonitor.interval: 30s
    asserts:
      - notFailedTemplate: {}

  - it: accepts Helm's global values when used as a dependency
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - notFailedTemplate: {}

  - it: accepts numbers for restart and retry counts
    set:
      chromium.restartAfter: 50
      libreOffice.restartAfter: 10
      webhook.maxRetry: 4
    asserts:
      - notFailedTemplate: {}

  - it: rejects unknown top-level values
    set:
      replicaCont: 2
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'replicaCont' not allowed"

  - it: rejects unknown values in chart-defined sections
    set:
      metrics.serviceMonitor.enabledd: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'enabledd' not allowed"

  - it: rejects wrong types
    set:
      api.downloadFromMaxConcurrency: lots
    asserts:
      - failedTemplate:
          errorPattern: "/api/downloadFromMaxConcurrency"

  - it: rejects unknown PDB eviction policies
    set:
      pdb.unhealthyPodEvictionPolicy: Sometimes
    asserts:
      - failedTemplate:
          errorPattern: "/pdb/unhealthyPodEvictionPolicy"

  - it: rejects malformed image digests
    set:
      image.digest: latest
    asserts:
      - failedTemplate:
          errorPattern: "/image/digest"

  - it: rejects a string for an allow or deny list
    set:
      chromium.allowList: ^https://example\.com/
    asserts:
      - failedTemplate:
          errorPattern: "/chromium/allowList"

  - it: rejects archive limits below 1
    set:
      api.archiveMaxEntries: 0
    asserts:
      - failedTemplate:
          errorPattern: "/api/archiveMaxEntries"

  - it: rejects values removed in 2.0.0
    set:
      prometheus.namespace: gotenberg
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'prometheus' not allowed"

  - it: rejects removed values in a section
    set:
      chromium.incognito: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'incognito' not allowed"

  - it: rejects a Chromium concurrency Gotenberg refuses
    set:
      chromium.maxConcurrency: 0
    asserts:
      - failedTemplate:
          errorPattern: "/chromium/maxConcurrency"

  - it: rejects a PDF concurrency of 0
    set:
      pdf.maxConcurrency: 0
    asserts:
      - failedTemplate:
          errorPattern: "/pdf/maxConcurrency"

  - it: rejects negative limits
    set:
      api.downloadFromMaxEntries: -1
    asserts:
      - failedTemplate:
          errorPattern: "/api/downloadFromMaxEntries"
