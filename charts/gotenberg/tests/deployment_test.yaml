suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: pulls the image by digest when one is set
    chart:
      appVersion: 1.2.3
    set:
      image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: gotenberg/gotenberg:1.2.3@sha256:1111111111111111111111111111111111111111111111111111111111111111

  - it: falls back to the deprecated traceHeader for the correlation ID header
    set:
      api.traceHeader: X-Trace
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-correlation-id-header=X-Trace

  - it: prefers correlationIdHeader over traceHeader
    set:
      api.traceHeader: X-Trace
      api.correlationIdHeader: X-Correlation
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-correlation-id-header=X-Correlation
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --api-correlation-id-header=X-Trace

  - it: falls back to the deprecated logging.format for the log format
    set:
      logging.format: json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-std-format=json

  - it: mounts the TLS secret and points the API at it
    set:
      api.tlsSecretName: gotenberg-tls
      volumes:
        - name: scratch
          emptyDir: {}
      volumeMounts:
        - name: scratch
          mountPath: /scratch
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-tls-cert-file=/tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-tls-key-file=/tls/tls.key
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: scratch
              emptyDir: {}
            - name: tls
              secret:
                secretName: gotenberg-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: scratch
              mountPath: /scratch
            - name: tls
              mountPath: /tls
              readOnly: true

  - it: reads basic auth credentials from an existing secret with default keys
    set:
      api.enableBasicAuth: true
      api.existingSecret: creds
      api.basicAuthUsername: ignored
      api.basicAuthPassword: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: GOTENBERG_API_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: creds
                  key: username
            - name: GOTENBERG_API_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: creds
                  key: password

  - it: uses custom secret keys for basic auth
    set:
      api.enableBasicAuth: true
      api.existingSecret: creds
      api.existingSecretUsernameKey: user
      api.existingSecretPasswordKey: pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: user
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: pass

  - it: sets inline basic auth credentials only when both are given
    set:
      api.enableBasicAuth: true
      api.basicAuthUsername: admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-enable-basic-auth
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].env

  - it: ignores basic auth credentials when basic auth is disabled
    set:
      api.basicAuthUsername: admin
      api.basicAuthPassword: secret
    asserts:
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].env

  - it: runs as the image's gotenberg user with a restricted security context by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            privileged: false
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].env

  - it: leaves the user to OpenShift and sets HOME there
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
      - notExists:
          path: spec.template.spec.containers[0].securityContext.seccompProfile
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /home/gotenberg

  - it: leaves the seccomp profile to the pod when it sets one
    set:
      podSecurityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/gotenberg.json
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.seccompProfile
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: Localhost

  - it: uses a custom securityContext as is and sets HOME for another user
    set:
      securityContext:
        runAsUser: 2000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 2000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /home/gotenberg

  - it: sets HOME when the pod securityContext picks another user
    set:
      podSecurityContext:
        runAsUser: 2000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /home/gotenberg

  - it: keeps a HOME set in extraEnv
    set:
      securityContext:
        runAsUser: 2000
      extraEnv:
        - name: HOME
          value: /tmp
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: HOME
              value: /tmp

  - it: passes zero restart and retry counts instead of dropping them
    set:
      chromium.restartAfter: 0
      libreOffice.restartAfter: "0"
      api.downloadFromMaxRetry: 0
      webhook.maxRetry: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --chromium-restart-after=0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --libreoffice-restart-after=0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --api-download-from-max-retry=0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --webhook-max-retry=0
