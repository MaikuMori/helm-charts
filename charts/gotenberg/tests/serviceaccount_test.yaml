suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
tests:
  - it: is not created by default
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the namespace default service account without a token by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: creates a service account named after the release
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gotenberg
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses the created service account in the pods
    template: templates/deployment.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: custom
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom

  - it: mounts the token on the pods and service account when automount is enabled
    set:
      serviceAccount.create: true
      serviceAccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: templates/deployment.yaml
