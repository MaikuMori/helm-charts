{{- if .Values.pdb.enabled -}}
{{- $min := .Values.pdb.minAvailable }}
{{- $max := .Values.pdb.maxUnavailable }}
{{- if and (not (kindIs "invalid" $min)) (not (kindIs "invalid" $max)) }}
{{- fail "set pdb.minAvailable or pdb.maxUnavailable, not both" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gotenberg.fullname" . }}
  labels:
    {{- include "gotenberg.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gotenberg.selectorLabels" . | nindent 6 }}
  {{- if not (kindIs "invalid" $max) }}
  maxUnavailable: {{ $max }}
  {{- else }}
  minAvailable: {{ ternary 1 $min (kindIs "invalid" $min) }}
  {{- end }}
  {{- with .Values.pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
{{- end }}
