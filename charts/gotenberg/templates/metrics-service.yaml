{{- if include "gotenberg.metricsEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gotenberg.fullname" . | trunc 55 | trimSuffix "-" }}-metrics
  labels:
    {{- include "gotenberg.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gotenberg.selectorLabels" . | nindent 4 }}
{{- end }}
