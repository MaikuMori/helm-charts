{{- if include "gotenberg.metricsEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gotenberg.metricsServiceName" . }}
  labels:
    {{- include "gotenberg.labels" . | nindent 4 }}
    {{- with .Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: metrics
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gotenberg.selectorLabels" . | nindent 4 }}
{{- end }}
