apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gotenberg.fullname" . }}
  labels:
    {{- include "gotenberg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "gotenberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gotenberg.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      serviceAccountName: {{ include "gotenberg.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- include "gotenberg.securityContext" . | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
          - gotenberg
          - --api-port={{ .Values.api.port }}
          {{- if .Values.api.tlsSecretName }}
          - --api-tls-cert-file=/tls/tls.crt
          {{- end }}
          {{- if .Values.api.tlsSecretName }}
          - --api-tls-key-file=/tls/tls.key
          {{- end }}
          {{- if .Values.api.timeout }}
          - --api-timeout={{ .Values.api.timeout }}
          {{- end }}
          {{- if .Values.api.bodyLimit }}
          - --api-body-limit={{ .Values.api.bodyLimit }}
          {{- end }}
          {{- if .Values.api.rootPath }}
          - --api-root-path={{ .Values.api.rootPath }}
          {{- end }}
          {{- if .Values.api.correlationIdHeader }}
          - --api-correlation-id-header={{ .Values.api.correlationIdHeader }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.disableHealthCheckRouteTelemetry) }}
          - --api-disable-health-check-route-telemetry={{ .Values.api.disableHealthCheckRouteTelemetry }}
          {{- end }}
          {{- if .Values.api.enableDebugRoute }}
          - --api-enable-debug-route
          {{- end }}
          {{- if .Values.api.startTimeout }}
          - --api-start-timeout={{ .Values.api.startTimeout }}
          {{- end }}
          {{- if .Values.api.enableBasicAuth }}
          - --api-enable-basic-auth
          {{- end }}
          {{- if .Values.api.enableOidcAuth }}
          - --api-enable-oidc-auth
          {{- end }}
          {{- if .Values.api.oidcIssuer }}
          - --api-oidc-issuer={{ .Values.api.oidcIssuer }}
          {{- end }}
          {{- if .Values.api.oidcAudience }}
          - --api-oidc-audience={{ .Values.api.oidcAudience }}
          {{- end }}
          {{- if .Values.api.oidcJwksUrl }}
          - --api-oidc-jwks-url={{ .Values.api.oidcJwksUrl }}
          {{- end }}
          {{- range .Values.api.downloadFromAllowList }}
          - {{ printf "--api-download-from-allow-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- range .Values.api.downloadFromDenyList }}
          - {{ printf "--api-download-from-deny-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- if .Values.api.downloadFromDenyPrivateIps }}
          - --api-download-from-deny-private-ips
          {{- end }}
          {{- if .Values.api.downloadFromDenyPublicIps }}
          - --api-download-from-deny-public-ips
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.downloadFromMaxRetry) }}
          - --api-download-from-max-retry={{ .Values.api.downloadFromMaxRetry | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.downloadFromMaxConcurrency) }}
          - --api-download-from-max-concurrency={{ .Values.api.downloadFromMaxConcurrency | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.downloadFromMaxEntries) }}
          - --api-download-from-max-entries={{ .Values.api.downloadFromMaxEntries | int64 }}
          {{- end }}
          {{- if .Values.api.downloadFromEnableEnvironmentProxy }}
          - --api-download-from-enable-environment-proxy
          {{- end }}
          {{- if .Values.api.disableDownloadFrom }}
          - --api-disable-download-from
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.archiveMaxEntries) }}
          - --api-archive-max-entries={{ .Values.api.archiveMaxEntries | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.archiveMaxRatio) }}
          - --api-archive-max-ratio={{ .Values.api.archiveMaxRatio | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.disableRootRouteTelemetry) }}
          - --api-disable-root-route-telemetry={{ .Values.api.disableRootRouteTelemetry }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.disableDebugRouteTelemetry) }}
          - --api-disable-debug-route-telemetry={{ .Values.api.disableDebugRouteTelemetry }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.api.disableVersionRouteTelemetry) }}
          - --api-disable-version-route-telemetry={{ .Values.api.disableVersionRouteTelemetry }}
          {{- end }}

          {{- if not (kindIs "invalid" .Values.chromium.restartAfter) }}
          - --chromium-restart-after={{ .Values.chromium.restartAfter | int64 }}
          {{- end }}
          {{- if .Values.chromium.autoStart }}
          - --chromium-auto-start
          {{- end }}
          {{- if .Values.chromium.startTimeout }}
          - --chromium-start-timeout={{ .Values.chromium.startTimeout }}
          {{- end }}
          {{- if .Values.chromium.allowFileAccessFromFiles }}
          - --chromium-allow-file-access-from-files
          {{- end }}
          {{- if .Values.chromium.allowInsecureLocalhost }}
          - --chromium-allow-insecure-localhost
          {{- end }}
          {{- range .Values.chromium.allowList }}
          - {{ printf "--chromium-allow-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- range .Values.chromium.denyList }}
          - {{ printf "--chromium-deny-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- if .Values.chromium.denyPrivateIps }}
          - --chromium-deny-private-ips
          {{- end }}
          {{- if .Values.chromium.denyPublicIps }}
          - --chromium-deny-public-ips
          {{- end }}
          {{- if .Values.chromium.ignoreCertificateErrors }}
          - --chromium-ignore-certificate-errors
          {{- end }}
          {{- if .Values.chromium.disableWebSecurity }}
          - --chromium-disable-web-security
          {{- end }}
          {{- if .Values.chromium.hostResolverRules }}
          - --chromium-host-resolver-rules={{ .Values.chromium.hostResolverRules }}
          {{- end }}
          {{- if .Values.chromium.proxyServer }}
          - --chromium-proxy-server={{ .Values.chromium.proxyServer }}
          {{- end }}
          {{- if .Values.chromium.enableEnvironmentProxy }}
          - --chromium-enable-environment-proxy
          {{- end }}
          {{- if .Values.chromium.disableJavaScript }}
          - --chromium-disable-javascript
          {{- end }}
          {{- if .Values.chromium.disableRoutes }}
          - --chromium-disable-routes
          {{- end }}
          {{- if .Values.chromium.sharedBrowserContext }}
          - --chromium-shared-browser-context
          {{- end }}
          {{- if .Values.chromium.clearCache }}
          - --chromium-clear-cache
          {{- end }}
          {{- if .Values.chromium.clearCookies }}
          - --chromium-clear-cookies
          {{- end }}
          {{- if .Values.chromium.clearStorage }}
          - --chromium-clear-storage
          {{- end }}
          {{- if not (kindIs "invalid" .Values.chromium.maxQueueSize) }}
          - --chromium-max-queue-size={{ .Values.chromium.maxQueueSize | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.chromium.maxConcurrency) }}
          - --chromium-max-concurrency={{ .Values.chromium.maxConcurrency | int64 }}
          {{- end }}
          {{- if .Values.chromium.idleShutdownTimeout }}
          - --chromium-idle-shutdown-timeout={{ .Values.chromium.idleShutdownTimeout }}
          {{- end }}
          {{- if .Values.chromium.maxMemory }}
          - --chromium-max-memory={{ .Values.chromium.maxMemory }}
          {{- end }}
          {{- if .Values.chromium.debugProtocol }}
          - --chromium-debug-protocol
          {{- end }}

          {{- if not (kindIs "invalid" .Values.libreOffice.restartAfter) }}
          - --libreoffice-restart-after={{ .Values.libreOffice.restartAfter | int64 }}
          {{- end }}
          {{- if .Values.libreOffice.autoStart }}
          - --libreoffice-auto-start
          {{- end }}
          {{- if .Values.libreOffice.startTimeout }}
          - --libreoffice-start-timeout={{ .Values.libreOffice.startTimeout }}
          {{- end }}
          {{- if .Values.libreOffice.disableRoutes }}
          - --libreoffice-disable-routes
          {{- end }}
          {{- if not (kindIs "invalid" .Values.libreOffice.maxQueueSize) }}
          - --libreoffice-max-queue-size={{ .Values.libreOffice.maxQueueSize | int64 }}
          {{- end }}
          {{- if .Values.libreOffice.idleShutdownTimeout }}
          - --libreoffice-idle-shutdown-timeout={{ .Values.libreOffice.idleShutdownTimeout }}
          {{- end }}
          {{- range .Values.libreOffice.allowList }}
          - {{ printf "--libreoffice-allow-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- range .Values.libreOffice.denyList }}
          - {{ printf "--libreoffice-deny-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- if .Values.libreOffice.denyPrivateIps }}
          - --libreoffice-deny-private-ips
          {{- end }}
          {{- if .Values.libreOffice.denyPublicIps }}
          - --libreoffice-deny-public-ips
          {{- end }}
          {{- if .Values.libreOffice.enableEnvironmentProxy }}
          - --libreoffice-enable-environment-proxy
          {{- end }}
          {{- if .Values.libreOffice.maxMemory }}
          - --libreoffice-max-memory={{ .Values.libreOffice.maxMemory }}
          {{- end }}
          {{- if .Values.libreOffice.enableMacros }}
          - --libreoffice-enable-macros
          {{- end }}

          {{- if not (kindIs "invalid" .Values.pdf.maxConcurrency) }}
          - --pdf-max-concurrency={{ .Values.pdf.maxConcurrency | int64 }}
          {{- end }}
          {{- if .Values.pdf.disableRoutes }}
          - --pdf-disable-routes
          {{- end }}
          {{- if .Values.pdf.disableStages }}
          - --pdf-disable-stages
          {{- end }}
          {{- if .Values.pdf.maxStreamBytes }}
          - --pdf-max-stream-bytes={{ .Values.pdf.maxStreamBytes }}
          {{- end }}
          {{- if .Values.pdf.maxEmbeddedFileBytes }}
          - --pdf-max-embedded-file-bytes={{ .Values.pdf.maxEmbeddedFileBytes }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.pdf.maxImagePixels) }}
          - --pdf-max-image-pixels={{ .Values.pdf.maxImagePixels | int64 }}
          {{- end }}
          {{- if not (kindIs "invalid" .Values.pdf.maxRenderPixels) }}
          - --pdf-max-render-pixels={{ .Values.pdf.maxRenderPixels | int64 }}
          {{- end }}
          {{- range .Values.pdf.allowList }}
          - {{ printf "--pdf-allow-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- range .Values.pdf.denyList }}
          - {{ printf "--pdf-deny-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- if .Values.pdf.denyPrivateIps }}
          - --pdf-deny-private-ips
          {{- end }}
          {{- if .Values.pdf.denyPublicIps }}
          - --pdf-deny-public-ips
          {{- end }}
          {{- if .Values.pdf.enableEnvironmentProxy }}
          - --pdf-enable-environment-proxy
          {{- end }}

          {{- if .Values.webhook.enableSyncMode }}
          - --webhook-enable-sync-mode
          {{- end }}
          {{- range .Values.webhook.allowList }}
          - {{ printf "--webhook-allow-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- range .Values.webhook.denyList }}
          - {{ printf "--webhook-deny-list=%s" (include "gotenberg.csvField" .) | toJson }}
          {{- end }}
          {{- if .Values.webhook.denyPrivateIps }}
          - --webhook-deny-private-ips
          {{- end }}
          {{- if .Values.webhook.denyPublicIps }}
          - --webhook-deny-public-ips
          {{- end }}
          {{- if not (kindIs "invalid" .Values.webhook.maxRetry) }}
          - --webhook-max-retry={{ .Values.webhook.maxRetry | int64 }}
          {{- end }}
          {{- if .Values.webhook.retryMinWait }}
          - --webhook-retry-min-wait={{ .Values.webhook.retryMinWait }}
          {{- end }}
          {{- if .Values.webhook.retryMaxWait }}
          - --webhook-retry-max-wait={{ .Values.webhook.retryMaxWait }}
          {{- end }}
          {{- if .Values.webhook.clientTimeout }}
          - --webhook-client-timeout={{ .Values.webhook.clientTimeout }}
          {{- end }}
          {{- if .Values.webhook.enableEnvironmentProxy }}
          - --webhook-enable-environment-proxy
          {{- end }}
          {{- if .Values.webhook.disable }}
          - --webhook-disable
          {{- end }}

          {{- if .Values.logging.stdFormat }}
          - --log-std-format={{ .Values.logging.stdFormat }}
          {{- end }}
          {{- if .Values.logging.stdLevelCase }}
          - --log-std-level-case={{ .Values.logging.stdLevelCase }}
          {{- end }}
          {{- if .Values.logging.level }}
          - --log-level={{ .Values.logging.level }}
          {{- end }}
          {{- if .Values.logging.fieldsPrefix }}
          - --log-fields-prefix={{ .Values.logging.fieldsPrefix }}
          {{- end }}
          {{- if .Values.logging.stdEnableGcpFields }}
          - --log-std-enable-gcp-fields
          {{- end }}

          - --gotenberg-graceful-shutdown-duration={{ .Values.gotenberg.gracefulShutdownDurationSec | int64 }}s
          {{- if .Values.gotenberg.hideBanner }}
          - --gotenberg-hide-banner
          {{- end }}
          env:
          {{- if .Values.api.enableBasicAuth }}
            {{- if .Values.api.existingSecret }}
            - name: GOTENBERG_API_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.existingSecretUsernameKey | default "username" }}
            - name: GOTENBERG_API_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.existingSecretPasswordKey | default "password" }}
            {{- else if and .Values.api.basicAuthUsername .Values.api.basicAuthPassword }}
            - name: GOTENBERG_API_BASIC_AUTH_USERNAME
              value: {{ .Values.api.basicAuthUsername }}
            - name: GOTENBERG_API_BASIC_AUTH_PASSWORD
              value: {{ .Values.api.basicAuthPassword }}
            {{- end }}
          {{- end }}
          {{- if include "gotenberg.metricsEnabled" . }}
            {{- include "gotenberg.validateMetrics" . }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.metrics.port | quote }}
          {{- end }}
          {{- $runAsUser := 1001 }}
          {{- if .Values.securityContext.runAsUser }}
            {{- $runAsUser = int .Values.securityContext.runAsUser }}
          {{- else if .Values.podSecurityContext.runAsUser }}
            {{- $runAsUser = int .Values.podSecurityContext.runAsUser }}
          {{- else if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
            {{- $runAsUser = 0 }}
          {{- end }}
          {{- $homeSet := false }}
          {{- range .Values.extraEnv }}
            {{- if eq .name "HOME" }}
              {{- $homeSet = true }}
            {{- end }}
          {{- end }}
          {{- if and (ne $runAsUser 1001) (not $homeSet) }}
            - name: HOME
              value: /home/gotenberg
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            {{- if include "gotenberg.metricsEnabled" . }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.api.tlsSecretName }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.api.tlsSecretName }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          {{- end }}
      terminationGracePeriodSeconds: {{ .Values.gotenberg.gracefulShutdownDurationSec }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.volumes .Values.api.tlsSecretName }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $.Values.api.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ $.Values.api.tlsSecretName }}
        {{- end }}
      {{- end }}
