apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gotenberg.fullname" . }}
  labels:
    {{- include "gotenberg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "gotenberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gotenberg.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      serviceAccountName: {{ include "gotenberg.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- include "gotenberg.securityContext" . | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
          - gotenberg
          - --api-port={{ .Values.api.port }}
          {{- if .Values.api.tlsSecretName }}
          - --api-tls-cert-file=/tls/tls.crt
          - --api-tls-key-file=/tls/tls.key
          {{- end }}
          {{- if .Values.api.basicAuth.enabled }}
          - --api-enable-basic-auth
          {{- end }}
          {{- include "gotenberg.flags" . | trim | nindent 10 }}
          {{- if not (kindIs "invalid" .Values.gotenberg.gracefulShutdownDurationSec) }}
          - --gotenberg-graceful-shutdown-duration={{ .Values.gotenberg.gracefulShutdownDurationSec | int64 }}s
          {{- end }}
          {{- include "gotenberg.validateAuth" . }}
          env:
          {{- with .Values.api.basicAuth }}
          {{- if .enabled }}
            {{- if .existingSecret }}
            - name: GOTENBERG_API_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .usernameKey | default "username" }}
            - name: GOTENBERG_API_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordKey | default "password" }}
            {{- else if and .username .password }}
            - name: GOTENBERG_API_BASIC_AUTH_USERNAME
              value: {{ .username | toString | toJson }}
            - name: GOTENBERG_API_BASIC_AUTH_PASSWORD
              value: {{ .password | toString | toJson }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if include "gotenberg.metricsEnabled" . }}
            {{- include "gotenberg.validateMetrics" . }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.metrics.port | quote }}
          {{- end }}
          {{- $runAsUser := 1001 }}
          {{- if .Values.securityContext.runAsUser }}
            {{- $runAsUser = int .Values.securityContext.runAsUser }}
          {{- else if .Values.podSecurityContext.runAsUser }}
            {{- $runAsUser = int .Values.podSecurityContext.runAsUser }}
          {{- else if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
            {{- $runAsUser = 0 }}
          {{- end }}
          {{- $homeSet := false }}
          {{- range .Values.extraEnv }}
            {{- if eq .name "HOME" }}
              {{- $homeSet = true }}
            {{- end }}
          {{- end }}
          {{- if and (ne $runAsUser 1001) (not $homeSet) }}
            - name: HOME
              value: /home/gotenberg
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            {{- if include "gotenberg.metricsEnabled" . }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- include "gotenberg.probe" (list . $.Values.api.tlsSecretName $.Values.api.rootPath) | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- include "gotenberg.probe" (list . $.Values.api.tlsSecretName $.Values.api.rootPath) | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- include "gotenberg.probe" (list . $.Values.api.tlsSecretName $.Values.api.rootPath) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with include "gotenberg.lifecycle" . }}
          lifecycle:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.api.tlsSecretName }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.api.tlsSecretName }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $shutdown := 30 }}
      {{- if not (kindIs "invalid" .Values.gotenberg.gracefulShutdownDurationSec) }}
        {{- $shutdown = int .Values.gotenberg.gracefulShutdownDurationSec }}
      {{- end }}
      terminationGracePeriodSeconds: {{ ternary (add $shutdown 10) .Values.terminationGracePeriodSeconds (kindIs "invalid" .Values.terminationGracePeriodSeconds) | int64 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.volumes .Values.api.tlsSecretName }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $.Values.api.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ $.Values.api.tlsSecretName }}
        {{- end }}
      {{- end }}
