name: Lint and Test Charts

on: pull_request

permissions:
  contents: read

jobs:
  helm-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          # We don't have go.sum file, but if this file changes we might as well download new dependencies.
          cache-dependency-path: .github/workflows/test.yml

      - name: Install helm-tools
        run: |
          go install github.com/cert-manager/helm-tool@v0.5.3

      - name: Run helm-tools
        run: |
          pushd charts/gotenberg
          helm-tool lint -e values.linter.exceptions
          helm-tool schema | jq . > generated-schema.json
          CURRENT_SCHEMA=$(cat values.schema.json)
          GENERATED_SCHEMA=$(cat generated-schema.json)
          if [ "$CURRENT_SCHEMA" != "$GENERATED_SCHEMA" ]; then
            echo "Outdated schema, regenerate it with 'helm-tool schema > values.schema.json'"
            exit 1
          fi
          popd

  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Look up: https://github.com/kubernetes-sigs/kind/releases
        k8s:
          - v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind ${{ matrix.k8s }} cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.k8s }}

      - name: Install Gateway API CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --helm-extra-set-args "--values=ci-values.yaml" --upgrade --target-branch ${{ github.event.repository.default_branch }}

  # Stable check to require in branch protection: the lint-test matrix check
  # names embed the kind node-image SHA and change on every image bump.
  ci-required:
    needs: [helm-tools, lint-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.helm-tools.result }}" != "success" ] || [ "${{ needs.lint-test.result }}" != "success" ]; then
            echo "Required jobs failed: helm-tools=${{ needs.helm-tools.result }}, lint-test=${{ needs.lint-test.result }}"
            exit 1
          fi
          echo "All required jobs succeeded."
