name: Lint and Test Charts

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache-dependency-path: tools/*/go.sum

      - name: Run actionlint
        run: |
          go -C tools/actionlint install github.com/rhysd/actionlint/cmd/actionlint
          actionlint -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/
          advanced-security: false
          version: 1.30.1

  helm-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache-dependency-path: tools/*/go.sum

      # Versions are pinned in tools/*/go.mod.
      - name: Install helm-tools
        run: |
          go -C tools/helm-tool install github.com/cert-manager/helm-tool
          go -C tools/helm-docs install github.com/norwoodj/helm-docs/cmd/helm-docs
          go -C tools/helm-schema install github.com/losisin/helm-values-schema-json/v2

      - name: Lint values
        run: helm-tool lint -e values.linter.exceptions
        working-directory: charts/gotenberg

      - name: Check schema is up to date
        working-directory: charts/gotenberg
        run: |
          helm-values-schema-json
          if ! git diff --exit-code -- values.schema.json; then
            echo "Outdated schema, regenerate it with 'helm schema' in charts/gotenberg"
            exit 1
          fi

      - name: Check README is up to date
        run: |
          helm-docs
          if ! git diff --exit-code -- '*.md'; then
            echo "Outdated README, regenerate it with 'helm-docs'"
            exit 1
          fi

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.1/unittest-1.2.1.tgz --verify=false

      - name: Run helm-unittest
        run: |
          if ! helm unittest --strict charts/*; then
            echo "::error::If the rendered output changed on purpose, update the snapshots with 'helm unittest -u charts/gotenberg' and commit them."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Look up: https://github.com/kubernetes-sigs/kind/releases
        k8s:
          - v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # Changes to the render test itself install every chart, so they get exercised.
      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BASE" HEAD -- test/render .github/scripts/render-test.js; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind ${{ matrix.k8s }} cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.k8s }}

      - name: Install Gateway API CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml

      # Installs once per charts/<chart>/ci/*-values.yaml file and keeps the releases for the render test.
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          ALL: ${{ steps.list-changed.outputs.all }}
        run: ct install --config ct.yaml --upgrade --skip-clean-up ${ALL:+--all}

      - name: Render documents with every installed release
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          node .github/scripts/render-test.js

      - name: Show cluster state
        if: failure() && steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl get pods --all-namespaces -o wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -100
          for pod in $(kubectl get pods --all-namespaces -l 'app.kubernetes.io/name in (gotenberg,gotenberg-test)' -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{" "}{end}'); do
            echo "::group::$pod"
            kubectl describe pod -n "${pod%%/*}" "${pod#*/}"
            kubectl logs -n "${pod%%/*}" "${pod#*/}" --all-containers --tail=200 || true
            kubectl logs -n "${pod%%/*}" "${pod#*/}" --all-containers --previous --tail=200 2>/dev/null || true
            echo "::endgroup::"
          done

  # Stable check to require in branch protection: the install matrix check
  # names embed the kind node-image SHA and change on every image bump.
  ci-required:
    needs: [workflow-lint, helm-tools, unit-test, lint, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Required jobs failed: $RESULTS"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
