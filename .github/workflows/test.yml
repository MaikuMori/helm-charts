name: Lint and Test Charts

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache-dependency-path: tools/*/go.sum

      - name: Run actionlint
        run: |
          go -C tools/actionlint install github.com/rhysd/actionlint/cmd/actionlint
          actionlint -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/
          advanced-security: false
          version: 1.31.1

  helm-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache-dependency-path: tools/*/go.sum

      # Versions are pinned in tools/*/go.mod.
      - name: Install helm-tools
        run: |
          go -C tools/helm-tool install github.com/cert-manager/helm-tool
          go -C tools/helm-docs install github.com/norwoodj/helm-docs/cmd/helm-docs
          go -C tools/helm-schema install github.com/losisin/helm-values-schema-json/v2

      - name: Lint values
        run: helm-tool lint -e values.linter.exceptions
        working-directory: charts/gotenberg

      - name: Check schema is up to date
        working-directory: charts/gotenberg
        run: |
          helm-values-schema-json
          if ! git diff --exit-code -- values.schema.json; then
            echo "Outdated schema, regenerate it with 'helm schema' in charts/gotenberg"
            exit 1
          fi

      - name: Check README is up to date
        run: |
          helm-docs
          if ! git diff --exit-code -- '*.md'; then
            echo "Outdated README, regenerate it with 'helm-docs'"
            exit 1
          fi

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.1/unittest-1.2.1.tgz --verify=false

      - name: Run helm-unittest
        run: |
          if ! npm run test:unit; then
            echo "::error::If the rendered output changed on purpose, update the snapshots with 'helm unittest -u charts/gotenberg' and commit them."
            exit 1
          fi

      - name: Check that numeric values set to 0 are rendered
        run: npm run test:zero

      - name: Render as a subchart
        run: |
          helm dependency build test/subchart
          for values in charts/gotenberg/ci/*.yaml charts/gotenberg/tests/values/*.yaml; do
            echo "Rendering with $values"
            yq '{"gotenberg": (. // {})}' "$values" > "$RUNNER_TEMP/subchart-values.yaml"
            helm template test test/subchart -f "$RUNNER_TEMP/subchart-values.yaml" > /dev/null
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: ct lint --config ct.yaml --target-branch "$TARGET_BRANCH"

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Look up: https://github.com/kubernetes-sigs/kind/releases
        k8s:
          - v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # Changes to the render test or the cluster setup install every chart, so they get exercised.
      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch "$TARGET_BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "origin/$TARGET_BRANCH...HEAD" -- test .github/workflows/test.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind ${{ matrix.k8s }} cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.k8s }}
          config: test/kind/cluster.yaml

      - name: Install Gateway API CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml

      # Installs once per charts/<chart>/ci/*-values.yaml file and keeps the releases for the render test.
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          ALL: ${{ steps.list-changed.outputs.all }}
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: ct install --config ct.yaml --target-branch "$TARGET_BRANCH" --skip-clean-up ${ALL:+--all}

      # Published releases are only upgraded from on the first Kubernetes version.
      - name: Upgrade from the target branch's chart and recent releases
        if: steps.list-changed.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
          RELEASES: ${{ strategy.job-index == 0 && 5 || 0 }}
        run: npm run test:upgrade -- "$TARGET_BRANCH" "$RELEASES"

      - name: Install as a subchart
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm dependency build test/subchart
          helm install subchart test/subchart --namespace subchart --create-namespace --wait --timeout 5m
          helm test subchart --namespace subchart --logs

      - name: Render documents with every installed release
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          npm run test:render

      - name: Show cluster state
        if: failure() && steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl get pods --all-namespaces -o wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -100
          for pod in $(kubectl get pods --all-namespaces -l 'app.kubernetes.io/name in (gotenberg,gotenberg-test)' -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{" "}{end}'); do
            echo "::group::$pod"
            kubectl describe pod -n "${pod%%/*}" "${pod#*/}"
            kubectl logs -n "${pod%%/*}" "${pod#*/}" --all-containers --tail=200 || true
            kubectl logs -n "${pod%%/*}" "${pod#*/}" --all-containers --previous --tail=200 2>/dev/null || true
            echo "::endgroup::"
          done

  # MicroShift built from OKD, for the chart's OpenShift defaults and SCC admission.
  openshift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: |
          if [[ -n "$(ct list-changed --config ct.yaml --target-branch "$TARGET_BRANCH")" ]] ||
            ! git diff --quiet "origin/$TARGET_BRANCH...HEAD" -- test/render test/lib.js .github/workflows/test.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start MicroShift
        if: steps.list-changed.outputs.changed == 'true'
        env:
          # Look up: https://github.com/microshift-io/microshift/releases
          IMAGE: ghcr.io/microshift-io/microshift:4.20.0_g153ff0ca9_4.20.0_okd_scos.16@sha256:235980dd065b3b0ef9c3d8788ee72a8583fd4b0f1e5ac996c09d5cbf1900e1ce
        run: |
          sudo podman run --privileged --detach --tty --name microshift --hostname 127.0.0.1.nip.io --publish 6443:6443 "$IMAGE"
          kubeconfig=/var/lib/microshift/resources/kubeadmin/kubeconfig
          timeout 600 bash -c "until sudo podman exec microshift test -f $kubeconfig; do sleep 2; done"
          mkdir -p ~/.kube
          sudo podman exec microshift cat "$kubeconfig" | tee ~/.kube/config > /dev/null
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
          timeout 600 bash -c 'until kubectl get nodes -o name 2>/dev/null | grep -q .; do sleep 5; done'
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
          timeout 600 bash -c 'until kubectl -n openshift-dns get daemonset dns-default >/dev/null 2>&1; do sleep 5; done'
          kubectl -n openshift-dns rollout status daemonset/dns-default --timeout=10m
          kubectl get securitycontextconstraints

      # restricted-v2 assigns a namespace UID. anyuid keeps the image's user and
      # rejects pods that set a seccomp profile. The hardened values' NetworkPolicy
      # has to allow OpenShift's DNS.
      - name: Install with the default and hardened values, and under the anyuid SCC
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm install restricted charts/gotenberg --namespace restricted --create-namespace --wait --timeout 5m
          helm install hardened charts/gotenberg --namespace hardened --create-namespace \
            --values charts/gotenberg/ci/hardened-values.yaml --wait --timeout 5m

          kubectl create namespace anyuid
          kubectl -n anyuid create serviceaccount gotenberg
          kubectl -n anyuid apply -f - <<'YAML'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: use-anyuid
          rules:
            - apiGroups: [security.openshift.io]
              resources: [securitycontextconstraints]
              resourceNames: [anyuid]
              verbs: [use]
          YAML
          kubectl -n anyuid create rolebinding gotenberg-anyuid --role=use-anyuid --serviceaccount=anyuid:gotenberg
          helm install anyuid charts/gotenberg --namespace anyuid --set serviceAccount.create=false --set serviceAccount.name=gotenberg --wait --timeout 5m

          for expected in restricted:restricted-v2 hardened:restricted-v2 anyuid:anyuid; do
            release=${expected%%:*}
            scc=$(kubectl -n "$release" get pods -l app.kubernetes.io/instance="$release",app.kubernetes.io/name=gotenberg -o jsonpath='{.items[0].metadata.annotations.openshift\.io/scc}')
            echo "$release: admitted under $scc"
            if [[ "$scc" != "${expected#*:}" ]]; then
              echo "::error::$release was admitted under the $scc SCC, want ${expected#*:}"
              exit 1
            fi
            helm test "$release" --namespace "$release" --logs
          done

      - name: Render documents with every installed release
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          npm run test:render

      - name: Show cluster state
        if: failure() && steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n openshift-dns get pods --show-labels || true
          kubectl get endpointslices -n default -o wide || true
          kubectl get networkpolicies --all-namespaces || true
          kubectl -n kube-kindnet get daemonset -o wide || true
          # Which destinations the hardened pod's NetworkPolicy actually blocks.
          dns=$(kubectl -n openshift-dns get pods -l dns.operator.openshift.io/daemonset-dns=default -o jsonpath='{.items[0].status.podIP}') || true
          gotenberg=$(kubectl -n restricted get pods -l app.kubernetes.io/name=gotenberg -o jsonpath='{.items[0].status.podIP}') || true
          for target in "$dns/5353" "$dns/53" "$gotenberg/3000" 1.1.1.1/53 1.1.1.1/443; do
            result=$(kubectl -n hardened exec deployment/hardened-gotenberg -- timeout 5 bash -c "exec 3<>/dev/tcp/$target" 2>&1 && echo connected || echo blocked)
            echo "hardened -> $target: $result"
          done
          for namespace in restricted hardened anyuid; do
            kubectl -n "$namespace" describe pods || true
            kubectl -n "$namespace" logs -l app.kubernetes.io/instance="$namespace" --all-containers --tail=200 || true
          done
          sudo podman logs --tail 200 microshift || true

  # Stable check to require in branch protection: the install matrix check
  # names embed the kind node-image SHA and change on every image bump.
  ci-required:
    needs: [workflow-lint, helm-tools, unit-test, lint, install, openshift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Required jobs failed: $RESULTS"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
