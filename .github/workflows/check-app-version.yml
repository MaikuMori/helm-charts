name: Check for Updates

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

# Serialize runs so a manual workflow_dispatch can't race the weekly cron and
# leave a pushed branch with no PR (or duplicate the same bump).
concurrency:
  group: check-app-version
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The app's PRs, unlike the Actions token's, trigger the test workflows.
      - name: Get the updater app's token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] later steps push with git
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for new Gotenberg release
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const chart = fs.readFileSync('charts/gotenberg/Chart.yaml', 'utf8');
            const current = chart.match(/^appVersion: *"(.*)"$/m)?.[1];
            if (!current) {
              core.setFailed('No appVersion in charts/gotenberg/Chart.yaml');
              return;
            }

            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'gotenberg', repo: 'gotenberg',
            });
            const latest = release.tag_name.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(latest)) {
              core.setFailed(`Unexpected latest Gotenberg release: '${release.tag_name}'`);
              return;
            }

            core.setOutput('current', current);
            core.setOutput('latest', latest);

            if (current === latest) {
              core.setOutput('update', 'false');
              return;
            }

            const { status } = await fetch(
              `https://hub.docker.com/v2/repositories/gotenberg/gotenberg/tags/${latest}`,
            );
            if (status === 404) {
              core.warning(`Release ${latest} has no gotenberg/gotenberg:${latest} image yet; will retry on the next run.`);
              core.setOutput('update', 'false');
            } else if (status === 200) {
              core.setOutput('update', 'true');
            } else {
              core.setFailed(`Docker Hub tag lookup for ${latest} returned HTTP ${status}`);
            }

      - name: Create or update pull request
        if: steps.check.outputs.update == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { promisify } = require('util');
            const execFile = promisify(require('child_process').execFile);

            const { CURRENT, LATEST } = process.env;
            const upstream = { owner: 'gotenberg', repo: 'gotenberg' };
            const here = { owner: context.repo.owner, repo: context.repo.repo };
            const hereFull = `${here.owner}/${here.repo}`;
            const branch = `bump-gotenberg-${LATEST}`;
            const chartPath = 'charts/gotenberg/Chart.yaml';
            const COMMIT_LIMIT = 100;
            const { BOT } = process.env;
            const { data: botUser } = await github.rest.users.getByUsername({ username: BOT });
            const BOT_EMAIL = `${botUser.id}+${BOT}@users.noreply.github.com`;
            const BOT_INTRO = 'Automated bump of Gotenberg';
            // Total PR-body cap. GitHub's hard limit is 65 536; leave headroom for
            // the boilerplate sections we always emit.
            const PR_BODY_MAX = 60000;
            const RELEASE_BODY_MAX = 8000;
            // Code-formats closing keywords and @mentions in inlined upstream
            // content, so it can't close issues here or notify upstream users.
            const sanitizeUpstreamMarkdown = (s) => s
              .replace(
                /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(#\d+|[\w.-]+\/[\w.-]+#\d+|GH-\d+)/gi,
                '$1 `$2`',
              )
              .replace(/(^|[^\w`/.@-])@([a-z\d](?:[a-z\d-]*[a-z\d])?(?:\/[\w.-]+)?)/gi, '$1`@$2`');

            const parts = (v) => v.replace(/^v/, '').split('.').map(Number);
            const cmpVer = (a, b) => {
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] ?? 0) - (b[i] ?? 0);
                if (d !== 0) return d;
              }
              return 0;
            };

            const sh = async (cmd, args, opts = {}) => {
              const { stdout, stderr } = await execFile(cmd, args, opts);
              if (stdout.trim()) core.info(stdout.trim());
              if (stderr.trim()) core.info(stderr.trim());
              return stdout;
            };

            // --- Gather upstream release notes for (CURRENT, LATEST] -----------
            const curParts = parts(CURRENT);
            const latParts = parts(LATEST);

            let releases = [];
            try {
              const all = await github.paginate(github.rest.repos.listReleases, {
                ...upstream, per_page: 100,
              });
              releases = all
                .filter(r => !r.draft && !r.prerelease)
                .filter(r => /^v\d+\.\d+\.\d+$/.test(r.tag_name))
                .map(r => ({ tag: r.tag_name, url: r.html_url, body: r.body || '', parts: parts(r.tag_name) }))
                .filter(r => cmpVer(r.parts, curParts) > 0 && cmpVer(r.parts, latParts) <= 0)
                .sort((a, b) => cmpVer(a.parts, b.parts));
            } catch (e) {
              core.warning(`Failed to list upstream releases: ${e.message}`);
            }

            // --- Gather commit list for the same range -------------------------
            let commits = [];
            try {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                ...upstream,
                basehead: `v${CURRENT}...v${LATEST}`,
              });
              commits = compare.data.commits.map(c => ({
                sha: c.sha,
                url: c.html_url,
                subject: c.commit.message.split('\n')[0],
              }));
            } catch (e) {
              core.warning(`Failed to fetch upstream compare: ${e.message}`);
            }

            // --- Bail out if we have no upstream provenance --------------------
            // Docker Hub can expose a tag before the GitHub release/tag is
            // published. Opening a PR with no release notes and no commits means
            // we're trusting Docker Hub alone, which is exactly when this script
            // produces misleading bump PRs.
            if (releases.length === 0 && commits.length === 0) {
              core.warning(
                `Upstream releases and compare both came back empty for ${CURRENT} -> ${LATEST}. ` +
                `Skipping PR creation — likely a tag/release timing skew. Will retry on the next run.`,
              );
              return;
            }

            // --- Build the PR body --------------------------------------------
            const truncate = (s, max) => s.length <= max
              ? s
              : `${s.slice(0, max)}\n\n_…release body truncated (${s.length - max} chars omitted)_`;

            const sections = [];
            sections.push('## Release notes');
            if (releases.length > 0) {
              // Newest first, like Dependabot. Release bodies pass through
              // sanitizeUpstreamMarkdown so issue-closing keywords from upstream
              // can't bleed into this repo.
              for (const r of [...releases].reverse()) {
                const safe = truncate(sanitizeUpstreamMarkdown(r.body), RELEASE_BODY_MAX);
                sections.push(
                  `<details>\n<summary><a href="${r.url}">${r.tag}</a></summary>\n\n${safe}\n\n</details>`
                );
              }
            } else {
              sections.push(`- https://github.com/${upstream.owner}/${upstream.repo}/releases/tag/v${LATEST}`);
            }

            if (commits.length > 0) {
              const lines = commits.slice(0, COMMIT_LIMIT)
                .map(c => `- [\`${c.sha.slice(0, 7)}\`](${c.url}) ${sanitizeUpstreamMarkdown(c.subject)}`);
              const overflow = commits.length > COMMIT_LIMIT
                ? `\n\n_…and ${commits.length - COMMIT_LIMIT} more commits_`
                : '';
              sections.push('## Commits');
              sections.push(
                `<details>\n<summary>${commits.length} commit(s) between <code>v${CURRENT}</code> and <code>v${LATEST}</code></summary>\n\n${lines.join('\n')}${overflow}\n\n</details>`
              );
              sections.push(`[See the full diff](https://github.com/${upstream.owner}/${upstream.repo}/compare/v${CURRENT}...v${LATEST})`);
            }

            const intro = `${BOT_INTRO} from \`${CURRENT}\` to \`${LATEST}\`.`;
            const tasks = [
              '**Remaining tasks:**',
              '- [ ] Review upstream release notes for breaking changes',
              '- [ ] Update `CHANGELOG.md`',
              '- [ ] Update `Chart.yaml` version and `artifacthub.io/changes` annotation',
              '- [ ] Run `helm-docs` and `helm schema` (in `charts/gotenberg`)',
            ].join('\n');

            // The notes sit between markers, so a later release can replace
            // them in a PR body a maintainer has rewritten.
            const NOTES_START = '<!-- gotenberg-release-notes -->';
            const NOTES_END = '<!-- /gotenberg-release-notes -->';
            const notes = sections.join('\n\n');
            // Caps the whole body, so pulls.create can't fail after the push.
            const notesBlock = (room) => {
              const note = `\n\n_…release notes truncated to fit GitHub's size limit. See the full diff link._`;
              const fitted = notes.length <= room ? notes : notes.slice(0, Math.max(0, room - note.length)) + note;
              return `${NOTES_START}\n${fitted}\n${NOTES_END}`;
            };
            const markers = NOTES_START.length + NOTES_END.length + 2;
            const body = [intro, notesBlock(PR_BODY_MAX - intro.length - tasks.length - markers - 4), tasks].join('\n\n');
            // Null when the body has no notes block.
            const withNotes = (prBody) => {
              const a = prBody.indexOf(NOTES_START);
              const b = prBody.indexOf(NOTES_END, a);
              if (a < 0 || b < 0) return null;
              const before = prBody.slice(0, a);
              const after = prBody.slice(b + NOTES_END.length);
              return before + notesBlock(PR_BODY_MAX - before.length - after.length - markers) + after;
            };

            // --- Manage open bump PRs -----------------------------------------
            // Restrict to same-repo PRs so a fork PR named bump-gotenberg-X.Y.Z
            // can't hijack the existing-PR / close-stale flows.
            const openPRs = await github.paginate(github.rest.pulls.list, {
              ...here, state: 'open', per_page: 100,
            });
            const bumpPRs = openPRs.filter(pr =>
              pr.head.repo &&
              pr.head.repo.full_name === hereFull &&
              /^bump-gotenberg-\d+\.\d+\.\d+$/.test(pr.head.ref)
            );

            const defaultBranch = context.payload.repository.default_branch;
            // A bump PR is the bot's until a maintainer pushes to it or rewrites its body.
            const maintainerOwned = async (pr) => {
              if (!(pr.body ?? '').startsWith(BOT_INTRO)) return true;
              const ref = pr.head.ref;
              // Explicit refspec because actions/checkout configures
              // remote.origin.fetch to a single-branch refspec by default.
              await sh('git', [
                'fetch', '--no-tags', 'origin',
                `+refs/heads/${ref}:refs/remotes/origin/${ref}`,
              ]);
              const { stdout: countOut } = await execFile('git', [
                'rev-list', '--count', `origin/${defaultBranch}..origin/${ref}`,
              ]);
              const { stdout: authorOut } = await execFile('git', [
                'log', '-1', '--pretty=%ae', `origin/${ref}`,
              ]);
              return parseInt(countOut.trim(), 10) !== 1 || authorOut.trim() !== BOT_EMAIL;
            };

            // Replaces the notes block of a maintainer's PR, keeping the rest of its body.
            const refreshNotes = async (pr) => {
              const updated = withNotes(pr.body ?? '');
              if (updated === null) {
                core.info(`PR #${pr.number} has no release notes block, leaving its body alone.`);
                return false;
              }
              if (updated !== pr.body) {
                await github.rest.pulls.update({ ...here, pull_number: pr.number, body: updated });
              }
              return true;
            };

            const existing = bumpPRs.find(pr => pr.head.ref === branch);
            if (existing) {
              if (await maintainerOwned(existing)) {
                core.info(`PR #${existing.number} already targets ${LATEST} and has maintainer changes, refreshing only its release notes.`);
                await refreshNotes(existing);
              } else {
                core.info(`PR #${existing.number} already targets ${LATEST}, refreshing body.`);
                await github.rest.pulls.update({
                  ...here, pull_number: existing.number, body,
                });
              }
              return;
            }

            // A bump PR with maintainer changes gets the new release notes and
            // one comment per release instead of a competing PR.
            const owned = [];
            for (const pr of bumpPRs) {
              if (pr.head.ref !== branch && await maintainerOwned(pr)) owned.push(pr);
            }
            if (owned.length > 0) {
              const marker = `<!-- gotenberg-release: ${LATEST} -->`;
              const releaseLink = `[\`${LATEST}\`](https://github.com/${upstream.owner}/${upstream.repo}/releases/tag/v${LATEST})`;
              for (const pr of owned) {
                const refreshed = await refreshNotes(pr);
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...here, issue_number: pr.number, per_page: 100,
                });
                if (comments.some(c => c.user?.login === BOT && (c.body ?? '').includes(marker))) {
                  core.info(`PR #${pr.number} already has a comment about ${LATEST}.`);
                  continue;
                }
                core.info(`PR #${pr.number} has maintainer changes, commenting about ${LATEST} instead of opening a PR.`);
                await github.rest.issues.createComment({
                  ...here,
                  issue_number: pr.number,
                  body: refreshed
                    ? `${marker}\nGotenberg ${releaseLink} is out. The release notes in the description now run from \`${CURRENT}\` to \`${LATEST}\`.`
                    : `${marker}\nGotenberg ${releaseLink} is out. This PR has maintainer changes, so no separate bump PR was opened.`,
                });
              }
              return;
            }

            // --- Create the new branch + bump commit --------------------------
            await sh('git', ['config', 'user.name', BOT]);
            await sh('git', ['config', 'user.email', BOT_EMAIL]);
            await sh('git', ['checkout', '-b', branch]);

            const chart = fs.readFileSync(chartPath, 'utf8');
            const escaped = CURRENT.replace(/\./g, '\\.');
            const updated = chart.replace(
              new RegExp(`appVersion: "${escaped}"`),
              `appVersion: "${LATEST}"`,
            );
            if (updated === chart) {
              core.setFailed(`Failed to update appVersion in ${chartPath}`);
              return;
            }
            fs.writeFileSync(chartPath, updated);

            await sh('git', ['add', chartPath]);
            await sh('git', ['commit', '-m', `Bump Gotenberg to version ${LATEST}`]);
            await sh('git', ['push', '-u', 'origin', branch]);

            const created = await github.rest.pulls.create({
              ...here,
              title: `Bump Gotenberg to ${LATEST}`,
              head: branch,
              base: defaultBranch,
              body,
            });
            const newPrUrl = created.data.html_url;
            core.info(`Opened ${newPrUrl}`);

            // --- Close superseded bump PRs ------------------------------------
            // Only the bot's own PRs are left at this point. The new PR's URL
            // goes in the close comment so the trail is navigable both directions.
            for (const pr of bumpPRs) {
              if (pr.head.ref === branch) continue;
              const ref = pr.head.ref;

              core.info(`Closing superseded PR #${pr.number} (${ref}) — replaced by ${newPrUrl}.`);
              await github.rest.issues.createComment({
                ...here,
                issue_number: pr.number,
                body: `Superseded by ${newPrUrl} (bump to \`${LATEST}\`).`,
              });
              await github.rest.pulls.update({
                ...here, pull_number: pr.number, state: 'closed',
              });
              try {
                await github.rest.git.deleteRef({ ...here, ref: `heads/${ref}` });
              } catch (e) {
                core.warning(`Failed to delete branch ${ref}: ${e.message}`);
              }
            }

  # Test tools that Dependabot can't track; tools/*/go.mod and actions are covered by it.
  check-test-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Actions token can't change workflow files, where most pins live.
      - name: Get the updater app's token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Open, update or close the update pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require('./.github/scripts/check-pinned-tools.js');
            await run({ github, context, core });
