name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] later steps push with git
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Prepare keys for signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.HELM_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSPHRASE_BASE64: ${{ secrets.HELM_SIGNING_PRIVATE_KEY_PASSPHRASE }}
          KEY_PATH: ".gpg-dir"
          SIGNING_KEY_PATH: ".gpg-dir/secring.gpg"
          SIGNING_KEY_PASSPHRASE_PATH: ".gpg-dir/passphrase"
        run: |
          mkdir "$KEY_PATH"
          base64 -d <<< "$SIGNING_KEY_BASE64" > "$SIGNING_KEY_PATH"
          base64 -d <<< "$SIGNING_KEY_PASSPHRASE_BASE64" > "$SIGNING_KEY_PASSPHRASE_PATH"
          echo "CR_PASSPHRASE_FILE=$SIGNING_KEY_PASSPHRASE_PATH" >> "$GITHUB_ENV"
          echo "CR_KEYRING=$SIGNING_KEY_PATH" >> "$GITHUB_ENV"

      - name: Extract release notes from changelog
        run: |
          for chart_dir in charts/*/; do
            version=$(grep '^version:' "${chart_dir}Chart.yaml" | awk '{print $2}' | tr -d '"')
            changelog="${chart_dir}CHANGELOG.md"
            notes="${chart_dir}RELEASE_NOTES.md"
            if [ -f "$changelog" ]; then
              awk -v ver="$version" '
                $0 ~ "^## " ver "$" { found=1; next }
                found && /^## / { exit }
                found && NF { body=1 }
                body { print }
              ' "$changelog" > "$notes"
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          config: .cr.yaml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" oci://ghcr.io/maikumori/helm-charts
          done
