version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directories:
      - "/tools/*"
    schedule:
      interval: "weekly"
    groups:
      tools:
        patterns:
          - "*"
    cooldown:
      default-days: 7
